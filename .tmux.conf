# Change prefix key to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a last-window

# Uses C-a a to send commands to a nested Tmux session
bind-key a send-prefix

# Ctrl+a Ctrl+z would pause tmux and drop to the outer shell. Easy to hit by
# mistake and of no use in an editor terminal, so turn it off.
unbind C-z

# Reduce escape lag
set -s escape-time 0

# Prevents resizing unless the smaller screen is active
setw -g aggressive-resize on

# Allow interaction with system clipboard
# Modern tmux (3.2+) has native macOS clipboard support

# Index starts at '1' and not '0'
set -g base-index 1
set-window-option -g pane-base-index 1

# History
set -g history-limit 50000

# Display messages for longer (default is 750ms)
set -g display-time 2000
set -g display-panes-time 2000

# screen like window toggling
bind Tab last-window

# open splits and new windows with the same path
bind '"' split-window -l 25% -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Ctrl+a Space: a menu of the common actions, so no shortcuts to memorize.
# The key on each row selects it. Most rows also match a Ctrl+a shortcut.
bind Space display-menu -T "#[align=centre] tmux " -x C -y C \
  "Split right"         |  "split-window -h -c '#{pane_current_path}'" \
  "Split down"          -  "split-window -v -c '#{pane_current_path}'" \
  "Zoom pane on/off"    z  "resize-pane -Z" \
  "Close pane"          x  "kill-pane" \
  "" \
  "New window"          c  "new-window -c '#{pane_current_path}'" \
  "Next window"         n  "next-window" \
  "Rename window"       ,  "command-prompt -I '#W' { rename-window '%%' }" \
  "" \
  "Scroll and copy"     [  "copy-mode" \
  "Switch session"      s  "choose-tree -Zs" \
  "Detach"              d  "detach-client" \
  "Reload config"       r  "source-file ~/.tmux.conf" \
  "All shortcuts"       ?  "list-keys -N"

# Pane resizing with vim-style keys (prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Check activity in other windows
setw -g monitor-activity off
set -g visual-activity on

# Terminal title. Zed shows it on the tab and in the Threads Sidebar. Pass
# through the title an agent CLI sets; show the folder when only a shell runs.
set -g set-titles on
set -g set-titles-string '#{?#{==:#{pane_title},#{host}},#{b:pane_current_path},#{pane_title}}'

# Let agent CLIs notify Zed (bells, escape sequences) from inside tmux
set -g allow-passthrough on

# Status bar
set -g status-position bottom
# Quiet bar on the terminal's own background. Gray text; the current window in
# orange. 256-color numbers, not hex, so it looks the same in every terminal.
set -g status-style fg=colour245,bg=default
setw -g window-status-current-style fg=colour208,bold

set -g status-left-length 30
set -g status-left "[#S:#[default]] "

setw -g window-status-format '#(basename "$(dirname "#{pane_current_path}")")/#{b:pane_current_path}#F'
setw -g window-status-current-format '#(basename "$(dirname "#{pane_current_path}")")/#{b:pane_current_path}#F'
set-option -g status-interval 3
set-window-option -g automatic-rename on

set -g status-right-length 50
set -g status-right "Ctrl+a Space: menu  %H:%M"

# Automatically re-number windows after any window is closed
set-option -g renumber-windows on

# reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Mouse options
set -g mouse on

# vim options
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
unbind [
unbind p
bind Escape copy-mode
bind p paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Copies (y, or a mouse drag) go to the system clipboard
if-shell 'command -v pbcopy' 'set -s copy-command pbcopy'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# Enforce colors and enable true color support
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:RGB"

# Enable focus events for better vim/neovim integration
set -g focus-events on

# Force tmux to use the default shell
set-option -g default-shell $SHELL